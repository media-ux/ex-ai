document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-between;align-items:flex-start;font-family:\"JetBrains Mono\";font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55}\n  .slide .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-family:\"JetBrains Mono\";font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55}\n  .slide .wordmark{font-family:\"Archivo\";font-weight:900;font-size:16px;letter-spacing:-0.05em;color:var(--golden);opacity:1}\n  .slide .wordmark .sep{display:inline-block;width:.09em;height:.09em;background:currentColor;border-radius:50%;vertical-align:.32em;margin:0 .02em}\n  .slide .num{color:var(--golden);opacity:.75}\n\n  /* subtle horizon bar on the edge */\n  .slide .horizon{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--ember),var(--golden) 70%,var(--cream-2))}\n\n  /* faint grid */\n  .grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--cream) 1px,transparent 1px),linear-gradient(90deg,var(--cream) 1px,transparent 1px);background-size:40px 40px;opacity:.03;pointer-events:none}\n\n  /* Type helpers (clamp-based so squares scale) */\n  .t-mega{font-family:\"Archivo\";font-weight:900;letter-spacing:-0.055em;line-height:.87;font-size:clamp(44px,9.5cqw,120px)}\n  .t-big{font-family:\"Archivo\";font-weight:800;letter-spacing:-0.04em;line-height:.95;font-size:clamp(28px,5.2cqw,64px)}\n  .t-med{font-family:\"Archivo\";font-weight:700;letter-spacing:-0.02em;line-height:1.05;font-size:clamp(20px,3.2cqw,40px)}\n  .t-body{font-family:\"Inter Tight\";font-weight:400;line-height:1.4;font-size:clamp(13px,1.8cqw,22px)}\n  .t-serif{font-family:\"Fraunces\";font-style:italic;font-weight:300;letter-spacing:-0.03em;line-height:.95}\n\n  .slide{container-type:inline-size}\n\n  .golden{color:var(--golden)}\n  .ember{color:var(--ember)}\n  .cream{color:var(--cream)}\n  .muted{opacity:.6}\n\n  /* Swipe cue */\n  .swipe{display:inline-flex;align-items:center;gap:8px;font-family:\"JetBrains Mono\";font-size:clamp(10px,1.2cqw,14px);letter-spacing:.14em;text-transform:uppercase;color:var(--golden)}\n  .swipe .arrow{display:inline-block;width:1.5em;height:1px;background:currentColor;position:relative}\n  .swipe .arrow::after{content:\"\";position:absolute;right:-1px;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}\n\n  /* ——— SLIDE-SPECIFIC ——— */\n\n  /* Slide 01 — Cover */\n  .s01 .inner{justify-content:space-between}\n  .s01 .title{display:flex;flex-direction:column;gap:.1em}\n  .s01 .eyebrow{font-family:\"JetBrains Mono\";font-size:clamp(10px,1.3cqw,15px);letter-spacing:.16em;text-transform:uppercase;color:var(--golden);margin-bottom:clamp(16px,3cqw,32px)}\n\n  /* Slide 02 — The question */\n  .s02{background:var(--cream);color:var(--ink)}\n  .s02 .top,.s02 .bottom{opacity:.55}\n  .s02 .wordmark{color:var(--ink)}\n  .s02 .horizon{background:linear-gradient(90deg,var(--ember),var(--golden) 70%,var(--ink) 100%)}\n  .s02 .num{color:var(--ember)}\n\n  /* Slide 03 — stat dominant */\n  .s03 .giant-stat{font-family:\"Archivo\";font-weight:900;letter-spacing:-0.08em;line-height:.8;font-size:clamp(120px,32cqw,400px);color:var(--golden)}\n\n  /* Slide 04 — List */\n  .s04 .row{display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,2.4cqw,28px);padding:clamp(10px,1.8cqw,18px) 0;border-bottom:1px solid var(--line);align-items:baseline}\n  .s04 .row:last-child{border-bottom:none}\n  .s04 .row .n{font-family:\"JetBrains Mono\";font-size:clamp(11px,1.4cqw,16px);color:var(--golden);opacity:.75;letter-spacing:.08em}\n  .s04 .row .t{font-family:\"Archivo\";font-weight:700;font-size:clamp(18px,3cqw,36px);letter-spacing:-0.02em;line-height:1.05}\n\n  /* Slide 05 — Quote slab */\n  .s05{background:var(--ember);color:var(--cream)}\n  .s05 .wordmark{color:var(--cream)}\n  .s05 .horizon{background:linear-gradient(90deg,var(--ink),var(--golden))}\n\n  /* Slide 06 — Profile reveal */\n  .s06 .profile{border:1px solid var(--line);padding:clamp(14px,2.4cqw,28px);margin-top:clamp(14px,2.4cqw,28px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6cqw,18px) clamp(14px,2.4cqw,28px);font-family:\"JetBrains Mono\";font-size:clamp(10px,1.3cqw,15px);line-height:1.5}\n  .s06 .profile .k{opacity:.5;letter-spacing:.08em;text-transform:uppercase}\n  .s06 .profile .v{color:var(--cream)}\n  .s06 .profile .v.hot{color:var(--ember)}\n\n  /* Slide 07 — Three columns */\n  .s07 .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:clamp(20px,4cqw,48px);border-top:1px solid var(--line)}\n  .s07 .cols > div{padding:clamp(14px,2.6cqw,28px) clamp(10px,1.6cqw,20px) 0 0;border-right:1px solid var(--line)}\n  .s07 .cols > div:last-child{border-right:none;padding-right:0}\n  .s07 .cols .lbl{font-family:\"JetBrains Mono\";font-size:clamp(10px,1.2cqw,14px);letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:clamp(10px,1.6cqw,20px)}\n  .s07 .cols .head{font-family:\"Archivo\";font-weight:800;font-size:clamp(18px,2.8cqw,34px);letter-spacing:-0.02em;line-height:1.02;margin-bottom:clamp(8px,1.4cqw,16px)}\n  .s07 .cols .desc{font-family:\"Inter Tight\";font-size:clamp(11px,1.5cqw,17px);line-height:1.45;opacity:.8}\n\n  /* Slide 08 — Principle slab */\n  .s08{background:var(--golden);color:var(--ink)}\n  .s08 .wordmark{color:var(--ink)}\n  .s08 .horizon{background:linear-gradient(90deg,var(--ember),var(--ink))}\n\n  /* Slide 09 — Checklist */\n  .s09 .check{display:grid;grid-template-columns:auto 1fr;gap:clamp(10px,1.8cqw,20px);padding:clamp(10px,1.6cqw,18px) 0;border-bottom:1px solid var(--line);align-items:baseline}\n  .s09 .check:last-child{border-bottom:none}\n  .s09 .check .box{width:clamp(14px,2cqw,22px);height:clamp(14px,2cqw,22px);border:1.5px solid var(--golden);flex-shrink:0;position:relative;transform:translateY(.25em)}\n  .s09 .check .box::after{content:\"\";position:absolute;inset:20%;background:var(--golden);opacity:0}\n  .s09 .check.on .box::after{opacity:1}\n  .s09 .check .t{font-family:\"Archivo\";font-weight:600;font-size:clamp(14px,2.2cqw,26px);letter-spacing:-0.01em;line-height:1.15}\n  .s09 .check .t .sub{display:block;font-family:\"Inter Tight\";font-weight:400;font-size:.72em;opacity:.6;margin-top:.2em}\n\n  /* Slide 10 — CTA */\n  .s10{background:var(--ink);color:var(--cream);text-align:left}\n  .s10 .cta{font-family:\"Archivo\";font-weight:900;letter-spacing:-0.05em;line-height:.9;font-size:clamp(40px,8cqw,100px)}\n  .s10 .cta em{font-family:\"Fraunces\";font-style:italic;font-weight:300;color:var(--golden)}\n  .s10 .domain{font-family:\"JetBrains Mono\";font-size:clamp(12px,1.6cqw,20px);letter-spacing:.12em;color:var(--golden);margin-top:clamp(16px,2.8cqw,32px)}\n  .s10 .sign{font-family:\"Archivo\";font-weight:900;font-size:clamp(48px,10cqw,140px);letter-spacing:-0.06em;color:var(--golden);margin-top:auto;line-height:.9}\n  .s10 .sign .sep{display:inline-block;width:.09em;height:.09em;background:currentColor;border-radius:50%;vertical-align:.32em;margin:0 .02em}\n\n  @media (max-width:760px){\n    .carousel{grid-template-columns:1fr}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"page\">\n  <div class=\"page-head\">\n    <h1>EX · AI — Instagram Carousel<\u002Fh1>\n    <div>10 Slides · 1080×1350 · Direction A · Monolith<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"carousel\">\n\n    <!-- ============ 01 · COVER ============ -->\n    <div class=\"slide s01\">\n      <div class=\"grid-bg\"><\u002Fdiv>\n      <div class=\"inner\">\n        <div class=\"top\">\n          <span>01 / 10<\u002Fspan>\n          <span>The Intelligence Layer<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"title\">\n          <div class=\"eyebrow\">Data Security · 2026<\u002Fdiv>\n          <div class=\"t-mega\">\n            You are<br>\n            feeding<br>\n            <span class=\"golden\">the machine.<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"t-body muted\" style=\"margin-top:clamp(16px,3cqw,32px);max-width:85%\">A seven-minute read on what happens to your business &amp; your life after you press send.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bottom\">\n          <span class=\"wordmark\">EX<span class=\"sep\"><\u002Fspan>AI<\u002Fspan>\n          <span class=\"swipe\">Swipe<span class=\"arrow\"><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"horizon\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 02 · THE QUESTION ============ -->\n    <div class=\"slide s02\">\n      <div class=\"inner\">\n        <div class=\"top\">\n          <span class=\"num\">02 / 10<\u002Fspan>\n          <span>The Question<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;margin-bottom:auto\">\n          <div class=\"t-serif\" style=\"font-size:clamp(30px,6.4cqw,76px);color:var(--ember)\">Are you sure<\u002Fdiv>\n          <div class=\"t-mega\" style=\"margin-top:.15em\">that is what<br>you want?<\u002Fdiv>\n          <div class=\"t-body\" style=\"margin-top:clamp(20px,3.8cqw,44px);max-width:88%;opacity:.75\">Every prompt is a disclosure. Every file is a copy. Every conversation is training data for something you didn't sign up for.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bottom\">\n          <span class=\"wordmark\">EX<span class=\"sep\"><\u002Fspan>AI<\u002Fspan>\n          <span>Keep swiping<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"horizon\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 03 · STAT ============ -->\n    <div class=\"slide s03\">\n      <div class=\"grid-bg\"><\u002Fdiv>\n      <div class=\"inner\">\n        <div class=\"top\">\n          <span class=\"num\">03 / 10<\u002Fspan>\n          <span>What's at stake<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;justify-content:center;flex:1;gap:clamp(10px,1.8cqw,20px)\">\n          <div class=\"giant-stat\">83<span style=\"font-size:.5em;vertical-align:top\">%<\u002Fspan><\u002Fdiv>\n          <div class=\"t-med\" style=\"max-width:92%\">of employees now paste company data into public AI tools — most of it without logging, review, or redaction.<\u002Fdiv>\n          <div class=\"t-body muted\" style=\"margin-top:clamp(8px,1.4cqw,16px)\">Cyberhaven Labs · enterprise telemetry · 2025<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bottom\">\n          <span class=\"wordmark\">EX<span class=\"sep\"><\u002Fspan>AI<\u002Fspan>\n          <span>03 / 10<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"horizon\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 04 · WHAT YOU'VE SHARED ============ -->\n    <div class=\"slide s04\">\n      <div class=\"inner\">\n        <div class=\"top\">\n          <span class=\"num\">04 / 10<\u002Fspan>\n          <span>What you've shared this week<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:clamp(20px,3.6cqw,40px)\">\n          <div class=\"t-big\" style=\"margin-bottom:clamp(14px,2.4cqw,28px)\">A partial<br>inventory.<\u002Fdiv>\n          <div class=\"row\"><span class=\"n\">01<\u002Fspan><span class=\"t\">Customer lists &amp; revenue figures<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span class=\"n\">02<\u002Fspan><span class=\"t\">Unsigned contracts and NDAs<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span class=\"n\">03<\u002Fspan><span class=\"t\">Medical notes. School letters. Therapy.<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span class=\"n\">04<\u002Fspan><span class=\"t\">Source code. Credentials. Architecture.<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span class=\"n\">05<\u002Fspan><span class=\"t\">The name of your child's school.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bottom\">\n          <span class=\"wordmark\">EX<span class=\"sep\"><\u002Fspan>AI<\u002Fspan>\n          <span>And that was Tuesday.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"horizon\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 05 · QUOTE ============ -->\n    <div class=\"slide s05\">\n      <div class=\"grid-bg\"><\u002Fdiv>\n      <div class=\"inner\">\n        <div class=\"top\" style=\"opacity:.65\">\n          <span>05 / 10<\u002Fspan>\n          <span>The quiet part<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;margin-bottom:auto\">\n          <div class=\"t-serif\" style=\"font-size:clamp(40px,8.8cqw,108px);color:var(--cream)\">\n            “If the model<br>\n            is <span class=\"golden\">free,<\u002Fspan><br>\n            you are<br>\n            the product.”\n          <\u002Fdiv>\n          <div class=\"t-body\" style=\"margin-top:clamp(16px,2.8cqw,32px);opacity:.85\">And if it's a subscription, you still might be.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bottom\" style=\"opacity:.65\">\n          <span class=\"wordmark\">EX<span class=\"sep\"><\u002Fspan>AI<\u002Fspan>\n          <span>— Rule Zero<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"horizon\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 06 · THE PROFILE ============ -->\n    <div class=\"slide s06\">\n      <div class=\"grid-bg\"><\u002Fdiv>\n      <div class=\"inner\">\n        <div class=\"top\">\n          <span class=\"num\">06 / 10<\u002Fspan>\n          <span>What gets built about you<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:clamp(18px,3cqw,36px)\">\n          <div class=\"t-big\">They're not<br>storing <span class=\"golden\">chats.<\u002Fspan><br>They're building a <span class=\"ember\">profile.<\u002Fspan><\u002Fdiv>\n          <div class=\"profile\">\n            <span class=\"k\">SUBJECT<\u002Fspan><span class=\"v\">You<\u002Fspan>\n            <span class=\"k\">EMPLOYER<\u002Fspan><span class=\"v\">Inferred<\u002Fspan>\n            <span class=\"k\">ROLE<\u002Fspan><span class=\"v\">Senior · confidence 0.92<\u002Fspan>\n            <span class=\"k\">HEALTH<\u002Fspan><span class=\"v hot\">Two conditions mentioned<\u002Fspan>\n            <span class=\"k\">FAMILY<\u002Fspan><span class=\"v hot\">Spouse · two minors<\u002Fspan>\n            <span class=\"k\">FINANCES<\u002Fspan><span class=\"v hot\">Est. HHI · five figures above peer<\u002Fspan>\n            <span class=\"k\">LOCATION<\u002Fspan><span class=\"v\">District · confidence 0.81<\u002Fspan>\n            <span class=\"k\">BEHAVIOR<\u002Fspan><span class=\"v\">Buys on Thursday<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bottom\">\n          <span class=\"wordmark\">EX<span class=\"sep\"><\u002Fspan>AI<\u002Fspan>\n          <span>Fictional example. Structurally real.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"horizon\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 07 · THREE THREATS ============ -->\n    <div class=\"slide s07\">\n      <div class=\"inner\">\n        <div class=\"top\">\n          <span class=\"num\">07 / 10<\u002Fspan>\n          <span>Three quiet risks<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"t-big\" style=\"margin-top:clamp(14px,2.6cqw,30px);max-width:90%\">The breach isn't<br>always a <span class=\"golden\">breach.<\u002Fspan><\u002Fdiv>\n        <div class=\"cols\">\n          <div>\n            <div class=\"lbl\">01 · Retention<\u002Fdiv>\n            <div class=\"head\">Your data<br>outlives<br>the chat.<\u002Fdiv>\n            <div class=\"desc\">Logs, embeddings, fine-tune sets, RLHF corpora — all persist far beyond the conversation.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"lbl\">02 · Inference<\u002Fdiv>\n            <div class=\"head\">They know<br>what you<br>never said.<\u002Fdiv>\n            <div class=\"desc\">Models triangulate role, health, salary, household and intent from patterns you didn't mean to reveal.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"lbl\">03 · Leakage<\u002Fdiv>\n            <div class=\"head\">Trained<br>in, spoken<br>out.<\u002Fdiv>\n            <div class=\"desc\">Confidential inputs can surface in another user's output. Quietly, occasionally, irreversibly.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bottom\" style=\"margin-top:clamp(16px,3cqw,32px)\">\n          <span class=\"wordmark\">EX<span class=\"sep\"><\u002Fspan>AI<\u002Fspan>\n          <span>07 / 10<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"horizon\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 08 · PRINCIPLE ============ -->\n    <div class=\"slide s08\">\n      <div class=\"inner\">\n        <div class=\"top\" style=\"color:var(--ink);opacity:.55\">\n          <span>08 / 10<\u002Fspan>\n          <span>The principle<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;margin-bottom:auto\">\n          <div class=\"t-body\" style=\"font-family:'JetBrains Mono';font-size:clamp(11px,1.4cqw,16px);letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-bottom:clamp(12px,2cqw,24px)\">Rule One<\u002Fdiv>\n          <div class=\"t-mega\" style=\"color:var(--ink)\">\n            Treat every<br>\n            prompt<br>\n            like a<br>\n            <span style=\"font-family:Fraunces;font-style:italic;font-weight:300;color:var(--ember)\">press release.<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"t-body\" style=\"margin-top:clamp(16px,2.8cqw,32px);max-width:88%;color:var(--ink);opacity:.75\">Because eventually, somewhere, someone will read it. That \"someone\" might be a model, a regulator, an adversary, or a 2029 fine-tune of your own company's data.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bottom\" style=\"color:var(--ink);opacity:.6\">\n          <span class=\"wordmark\">EX<span class=\"sep\"><\u002Fspan>AI<\u002Fspan>\n          <span>08 / 10<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"horizon\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 09 · CHECKLIST ============ -->\n    <div class=\"slide s09\">\n      <div class=\"grid-bg\"><\u002Fdiv>\n      <div class=\"inner\">\n        <div class=\"top\">\n          <span class=\"num\">09 / 10<\u002Fspan>\n          <span>What to do Monday morning<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:clamp(18px,3cqw,36px)\">\n          <div class=\"t-big\" style=\"margin-bottom:clamp(14px,2.4cqw,28px)\">The five-<br>minute <span class=\"golden\">audit.<\u002Fspan><\u002Fdiv>\n          <div class=\"check on\"><span class=\"box\"><\u002Fspan><span class=\"t\">Turn off chat history &amp; training on public tools<span class=\"sub\">Settings → Data controls. One click. Do it now.<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"check on\"><span class=\"box\"><\u002Fspan><span class=\"t\">Move sensitive work to private endpoints<span class=\"sub\">Enterprise plans, self-hosted, or vetted private deployments.<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"check on\"><span class=\"box\"><\u002Fspan><span class=\"t\">Redact before you paste<span class=\"sub\">Names, numbers, client IDs, health details, legal terms.<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"check on\"><span class=\"box\"><\u002Fspan><span class=\"t\">Write one policy. Make it one page.<span class=\"sub\">Your team will read one page. They will not read fourteen.<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"check on\"><span class=\"box\"><\u002Fspan><span class=\"t\">Log it. Review it monthly.<span class=\"sub\">What models · what data · who authorised · what stayed private.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bottom\">\n          <span class=\"wordmark\">EX<span class=\"sep\"><\u002Fspan>AI<\u002Fspan>\n          <span>09 / 10<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"horizon\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 10 · CTA ============ -->\n    <div class=\"slide s10\">\n      <div class=\"grid-bg\"><\u002Fdiv>\n      <div class=\"inner\">\n        <div class=\"top\">\n          <span class=\"num\">10 / 10<\u002Fspan>\n          <span>Build the intelligence layer<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:clamp(24px,4.5cqw,56px)\">\n          <div class=\"cta\">\n            We build<br>\n            AI that<br>\n            <em>keeps your<br>secrets.<\u002Fem>\n          <\u002Fdiv>\n          <div class=\"t-body muted\" style=\"margin-top:clamp(16px,2.8cqw,32px);max-width:82%\">Private intelligence infrastructure for research, media, finance and education. Your data, your logs, your rules.<\u002Fdiv>\n          <div class=\"domain\">ex-ai.co  →  book a call<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sign\">EX<span class=\"sep\"><\u002Fspan>AI<\u002Fdiv>\n        <div class=\"bottom\" style=\"margin-top:clamp(20px,3cqw,32px);color:var(--cream);opacity:.5\">\n          <span>Part of the EX Family · Intelligence · Capital · Finance · Education<\u002Fspan>\n          <span>10 / 10<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"horizon\"><\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
